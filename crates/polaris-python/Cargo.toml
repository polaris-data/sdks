[package]
name = "polaris-python"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
description = "Native Python bindings for the Polaris market data SDK."
repository = "https://github.com/polaris-data/sdks"
publish = false
license.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
polaris-data = { path = "../polaris-data" }
chrono.workspace = true
futures-util.workspace = true
pyo3 = { version = "0.28", features = ["abi3-py39", "extension-module"] }
pythonize = "0.28"
serde.workspace = true
serde_json.workspace = true
