name: Approval timeout watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report stale approvals without cancelling their release runs
        required: true
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-approvals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Cancel stale release approvals
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=(
            --repository "$GITHUB_REPOSITORY"
            --cutoff-minutes 10
          )
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 .github/scripts/cancel_stale_approvals.py "${args[@]}"
