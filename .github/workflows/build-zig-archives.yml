name: Build Zig archives

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python tools/install-toolchain.py
      - run: python tools/package-zig.py archives
      - uses: actions/upload-artifact@v4
        with:
          name: polaris-zig-archives
          path: crates/polaris-data/prebuilt/
          if-no-files-found: error
