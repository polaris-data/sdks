name: Release Python

on:
  push:
    tags: ["python-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing python-vX.Y.Z tag to release
        required: true
        type: string

permissions:
  contents: read

env:
  MATURIN_VERSION: v1.14.1
  RELEASE_REF: ${{ inputs.tag || github.ref }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  archives:
    uses: ./.github/workflows/build-zig-archives.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate tag and package versions
        run: python .github/scripts/check-release-version.py "$RELEASE_TAG"
      - name: Validate lockfiles
        run: |
          uv lock --check
          cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Require a commit from main
        run: |
          git fetch --no-tags origin main
          tag_commit=$(git rev-parse "${RELEASE_TAG}^{commit}")
          git merge-base --is-ancestor "$tag_commit" origin/main

  linux:
    needs: [archives, validate]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        manylinux: [manylinux2014, musllinux_1_2]
    runs-on: ${{ matrix.target == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@v4
        with:
          name: polaris-zig-archives
          path: sdk/rust/prebuilt
      - uses: actions/download-artifact@v4
        with:
          name: polaris-generated-sdk-sources
          path: .
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          command: build
          args: --release --locked --compatibility pypi --out dist
      - name: Install and test Linux wheel
        env:
          PYTHON_IMAGE: ${{ matrix.manylinux == 'musllinux_1_2' && 'python:3.13-alpine' || 'python:3.13-slim' }}
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work "$PYTHON_IMAGE" \
            sh -c 'python tools/check-python-dist.py dist/*.whl'
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist/*.whl

  macos:
    needs: [archives, validate]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@v4
        with:
          name: polaris-zig-archives
          path: sdk/rust/prebuilt
      - uses: actions/download-artifact@v4
        with:
          name: polaris-generated-sdk-sources
          path: .
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          command: build
          args: --release --locked --compatibility pypi --out dist
      - run: python tools/check-python-dist.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-${{ matrix.target }}
          path: dist/*.whl

  windows:
    needs: [archives, validate]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x64
            python_arch: x64
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@v4
        with:
          name: polaris-zig-archives
          path: sdk/rust/prebuilt
      - uses: actions/download-artifact@v4
        with:
          name: polaris-generated-sdk-sources
          path: .
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          command: build
          args: --release --locked --compatibility pypi --out dist
      - shell: pwsh
        run: python tools/check-python-dist.py (Get-ChildItem dist/*.whl).FullName
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    needs: [archives, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@v4
        with:
          name: polaris-zig-archives
          path: sdk/rust/prebuilt
      - uses: actions/download-artifact@v4
        with:
          name: polaris-generated-sdk-sources
          path: .
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python tools/package-zig.py stage-source
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - run: python tools/check-python-dist.py dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/polaris-data
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
