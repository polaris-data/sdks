name: Release Rust

on:
  push:
    tags: ["rust-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archives:
    uses: ./.github/workflows/build-zig-archives.yml
    with:
      ref: ${{ github.ref }}

  validate:
    needs: archives
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate tag and package version
        run: python .github/scripts/check-release-version.py "$GITHUB_REF_NAME"
      - name: Validate lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Require a commit from main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          tag_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          git merge-base --is-ancestor "$tag_commit" origin/main
      - uses: actions/download-artifact@v4
        with:
          name: polaris-zig-archives
          path: sdk/rust/prebuilt
      - uses: actions/download-artifact@v4
        with:
          name: polaris-generated-sdk-sources
          path: .
      - run: python tools/package-zig.py stage-source
      - run: cargo test -p polaris-data --locked
      - run: cargo package -p polaris-data --locked --allow-dirty
      - run: python tools/check-rust-dist.py target/package/polaris-data-*.crate
      - uses: actions/upload-artifact@v4
        with:
          name: polaris-rust-crate
          path: target/package/polaris-data-*.crate

  publish:
    if: github.ref_type == 'tag'
    needs: [archives, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: crates-io
      url: https://crates.io/crates/polaris-data
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: polaris-zig-archives
          path: sdk/rust/prebuilt
      - uses: actions/download-artifact@v4
        with:
          name: polaris-generated-sdk-sources
          path: .
      - run: python3 tools/package-zig.py stage-source
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish -p polaris-data --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
