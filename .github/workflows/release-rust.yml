name: Release Rust

on:
  push:
    tags: ["rust-v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate tag and package version
        run: python .github/scripts/check-release-version.py "$GITHUB_REF_NAME"
      - name: Validate lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null
      - name: Require a commit from main
        run: |
          git fetch --no-tags origin main
          tag_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          git merge-base --is-ancestor "$tag_commit" origin/main
      - run: cargo test -p polaris-data --locked
      - run: cargo publish -p polaris-data --locked --dry-run

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: crates-io
      url: https://crates.io/crates/polaris-data
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish -p polaris-data --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
