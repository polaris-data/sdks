[package]
name = "polaris-data"
version = "0.15.0"
include = ["src/**", "build.rs", "prebuilt/**", "zig-source/**", "Cargo.toml"]
edition.workspace = true
rust-version.workspace = true
description = "Rust SDK for the Polaris market data API."
readme = "../../README.md"
documentation = "https://docs.rs/polaris-data"
homepage = "https://polaris.supply/docs"
repository = "https://github.com/polaris-data/sdks"
license.workspace = true
keywords = ["polaris", "market-data", "trading", "async"]
categories = ["api-bindings", "finance"]

[lib]
name = "polaris_data"

[dependencies]
async-stream = "0.3"
futures-core = "0.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
futures-util.workspace = true
tokio.workspace = true
