[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "polaris-data"
version = "0.10.1"
description = "Python SDK for the Polaris market data API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Polaris" }
]
dependencies = []
keywords = ["polaris", "market-data", "trading", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://polaris.supply"
Repository = "https://github.com/polaris-data/sdks"

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "orjson>=3.10.0",
  "pytest>=8.0.0",
  "zstandard>=0.23.0",
]

[tool.maturin]
manifest-path = "crates/polaris-python/Cargo.toml"
python-source = "python"
module-name = "polaris_data._native"
bindings = "pyo3"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
